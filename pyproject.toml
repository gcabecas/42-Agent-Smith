[project]
name = "42-Agent-Smith"
version = "1.00.0"
description = "This is a project where you build an autonomous AI agent capable of reasoning, generating, executing, and iterating on code to solve programming challenges in a secure, sandboxed environment."
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "flake8>=7.0",
    "mypy>=1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]