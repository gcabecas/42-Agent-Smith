[project]
name = "42-Agent-Smith"
version = "1.00.0"
description = "This is a project where you build an autonomous AI agent capable of reasoning, generating, executing, and iterating on code to solve programming challenges in a secure, sandboxed environment."
requires-python = "==3.10.*"
dependencies = [
    "docker>=7.0.0",
    "pydantic",
    "mcp>=2.2.0",
    "flask",
    "gunicorn",
    "httpx",
    "tree-sitter",
    "tree-sitter-language-pack",
    "GitPython",
    "jedi",
    "openai",
    "fire",
    "python-dotenv",
    "pexpect",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.0",
    "types-docker",
]

[project.scripts]
agent_mbpp = "src.agent.cli:mbpp"
agent_swebench = "src.agent.cli:swebench"
sandbox = "src.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
